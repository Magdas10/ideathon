title: Suspicious OS Credential Dumping via LSASS Memory
id: 65432100-4321-4321-4321-432100654321
status: stable
description: Detects execution of procdump.exe or rundll32.exe with LSASS memory dumping
  arguments, indicative of OS Credential Dumping via LSASS Memory.
tags:
- attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|within:
    - C:\\Users\\Public\\procdump.exe
    - C:\\Windows\\System32\\rundll32.exe
    User|equals: svc_backup
    CommandLine|contains:
    - -ma lsass.exe
    - comsvcs.dll, MiniDump
  condition: and
level: high