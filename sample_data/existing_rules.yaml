title: Suspicious PowerShell Encoded Command
id: 11111111-1111-1111-1111-111111111111
status: stable
description: Detects execution of PowerShell with an encoded command argument, commonly used to obfuscate malicious scripts.
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - '-enc'
      - '-EncodedCommand'
  condition: selection
level: high
---
title: New Scheduled Task Created
id: 22222222-2222-2222-2222-222222222222
status: stable
description: Detects creation of a new scheduled task via schtasks.exe, a common persistence technique.
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/create'
  condition: selection
level: medium
---
title: Registry Run Key Persistence
id: 33333333-3333-3333-3333-333333333333
status: stable
description: Detects modification of the Run registry key used for persistence at startup.
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    TargetObject|contains: '\CurrentVersion\Run\'
  condition: selection
level: medium
